<div class="assistant-widget">

    <!-- Floating Greeting -->
    <div class="assistant-greeting" id="assistant-greeting">

        <p id="assistant-greeting-text"
           data-i18n="assistantGreeting">
        </p>

    </div>

    <!-- Floating Button -->
     <div
    class="assistant-greeting" id="assistant-greeting">
     <p id="assistant-greeting-text"data-i18n="assistantGreeting"></p>
    </div>
    
    <button
        class="assistant-toggle" id="assistant-toggle">

        <i class="fa-solid fa-cloud-sun"></i>

        <span
            id="assistant-button-text"
            data-i18n="assistantButton">
        </span>

    </button>

    <!-- Chat Window -->
    <div
        class="assistant-window"
        id="assistant-window">

        <!-- Header -->
        <div class="assistant-header">

            <div class="assistant-title">

                <i class="fa-solid fa-cloud-sun"></i>

                <div>

                    <h3
                        id="assistant-title"
                        data-i18n="assistantTitle">
                    </h3>

                    <span id="assistant-city">
                    </span>

                </div>

            </div>

            <button
                class="assistant-close"
                id="assistant-close">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <!-- Chat Body -->
        <div
            class="assistant-body"
            id="assistant-body">

            <!-- Welcome Message -->
            <div
                class="assistant-message bot"
                id="assistant-welcome-message">

                <p
                    id="assistant-welcome"
                    data-i18n="assistantWelcome">
                </p>

            </div>

            <!-- Quick Actions -->
            <div
                class="assistant-actions"
                id="assistant-actions">

                <button
                    class="assistant-action"
                    data-question="travel">

                    <i class="fa-solid fa-plane"></i>

                    <span
                        data-i18n="travelPlan">
                    </span>

                </button>

                <button
                    class="assistant-action"
                    data-question="clothing">

                    <i class="fa-solid fa-shirt"></i>

                    <span
                        data-i18n="clothingAdvice">
                    </span>

                </button>

                <button
                    class="assistant-action"
                    data-question="outdoor">

                    <i class="fa-solid fa-person-hiking"></i>

                    <span
                        data-i18n="outdoorActivity">
                    </span>

                </button>

                <button
                    class="assistant-action"
                    data-question="health">

                    <i class="fa-solid fa-heart-pulse"></i>

                    <span
                        data-i18n="weatherSafety">
                    </span>

                </button>

            </div>

        </div>

        <!-- Input -->
        <div class="assistant-input">

            <input
                id="assistant-input"
                type="text"
                autocomplete="off"
                data-placeholder="assistantPlaceholder">

            <button id="assistant-send">

                <i class="fa-solid fa-paper-plane"></i>

            </button>

        </div>

    </div>

</div>
