<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Details | Weatherly</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="details.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="main-container inner-page details-page">

    <!-- == NAVBAR == -->

    <nav class="navbar">

        <div class="logo">

            <i class="fa-solid fa-cloud-sun"></i>

            Weatherly

        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html" data-i18n="home"></a>
            </li>

            <li>
                <a href="forecast.html" data-i18n="forecast"></a>
            </li>

            <li>
                <a class="active"
                   href="details.html" data-i18n="details"></a>
            </li>

            <li>
                <a href="favorites.html" data-i18n="favorites"></a>
            </li>

            <li>
                <a href="about.html" data-i18n="about"></a>
            </li>

        </ul>
        <div class="nav-actions">

           <button
               id="language-btn"
               class="language-btn">

              <i class="fa-solid fa-globe"></i>

           <span>EN</span>
  
          </button>
          <button
           class="dark-mode-btn"
           aria-label="Dark Mode">

          <i class="fa-solid fa-moon"></i>

        </button>

      </div>

    </nav>

    <!-- === HEADER === -->

    <section class="details-header">

        <h1 data-i18n="weatherDetails"></h1>

        <p id="details-city" data-i18n="loading"></p>

    </section>

    <!-- === GRID === -->

    <section class="details-grid">

        <!-- Humidity -->

        <div class="detail-card">

            <i class="fa-solid fa-droplet"></i>

            <h3 data-i18n="humidity"></h3>

            <span id="humidity">--</span>

        </div>

        <!-- Wind -->

        <div class="detail-card">

            <i class="fa-solid fa-wind"></i>

            <h3 data-i18n="wind"></h3>

            <span id="wind">--</span>

        </div>

        <!-- Pressure -->

        <div class="detail-card">

            <i class="fa-solid fa-gauge-high"></i>

            <h3 data-i18n="pressure"></h3>

            <span id="pressure">--</span>

        </div>

        <!-- Visibility -->

        <div class="detail-card">

            <i class="fa-solid fa-eye"></i>

            <h3 data-i18n="visibility"></h3>

            <span id="visibility">--</span>

        </div>

        <!-- Sunrise -->

        <div class="detail-card">

            <i class="fa-regular fa-sun"></i>

            <h3 data-i18n="sunrise"></h3>

            <span id="sunrise">--</span>

        </div>

        <!-- Sunset -->

        <div class="detail-card">

            <i class="fa-solid fa-cloud-sun"></i>

            <h3 data-i18n="sunset"></h3>

            <span id="sunset">--</span>

        </div>

    </section>

</div>
<script src="locales/en.js"></script>
<script src="locales/fa.js"></script>
<script src="i18n.js"></script>
<script src="details.js"></script>

</body>
</html>
