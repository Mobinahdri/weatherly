<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forecast | Weatherly</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="forecast.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="main-container forecast-page">

    <!-- == NAVBAR == -->

    <nav class="navbar">

        <div class="logo">

            <i class="fa-solid fa-cloud-sun"></i>

            Weatherly

        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html" data-i18n="home"></a>
            </li>

            <li>
                <a class="active"
                   href="forecast.html" data-i18n="forecast"></a>
            </li>

            <li>
                <a href="details.html" data-i18n="details"></a>
            </li>

            <li>
                <a href="favorites.html" data-i18n="favorites"> </a>
            </li>

            <li>
                <a href="about.html" data-i18n="about">
                </a>
            </li>

        </ul>

         <div class="nav-actions">

           <button
               id="language-btn"
               class="language-btn">

            <i class="fa-solid fa-globe"></i>

           <span>EN</span>
  
           </button>
           <button
           class="dark-mode-btn"
           aria-label="Dark Mode"> 

          <i class="fa-solid fa-moon"></i>

          </button>

         </div>

    </nav>

    <!-- == HEADER === -->

    <section class="forecast-header">

        <h1 data-i18n="forecastTitle"> </h1>

        <p id="forecast-city" data-i18n="loading"></p>

    </section>

    <!-- === CARDS === -->

    <section
        id="forecast-container"
        class="forecast-container">

    </section>

    <!-- ===== CHART ==== -->

    <section class="chart-card">

        <h2 data-i18n="temperatureChart"></h2>

        <div class="chart-wrapper">

            <canvas id="temperatureChart"></canvas>

        </div>

    </section>

</div>
<script src="locales/en.js"></script>
<script src="locales/fa.js"></script>
<script src="i18n.js"></script>
<script src="forecast.js"></script>
</body>
</html>
